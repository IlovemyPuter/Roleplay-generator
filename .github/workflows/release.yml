name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          if (Test-Path "Projekt RPG\requirements.txt") { pip install -r "Projekt RPG\requirements.txt" }
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "RoleplayGenerator" `
            --paths "Projekt RPG" `
            --add-data "Projekt RPG\prompts;prompts" `
            --add-data "Projekt RPG\characters;characters" `
            "Projekt RPG\main.py"

      - name: Package ZIP archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\RoleplayGenerator\*" -DestinationPath "RoleplayGenerator-$tag-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RoleplayGenerator-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
